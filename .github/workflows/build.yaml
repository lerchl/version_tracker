name: Build ARM64 executable

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Get version from Cargo.toml
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build (develop)
        if: github.ref == 'refs/heads/develop'
        run: cargo build

      - name: Build (main)
        if: github.ref == 'refs/heads/main'
        run: cargo build --release

      - name: Rename binary (develop)
        if: github.ref == 'refs/heads/develop'
        run: cp target/debug/version_tracker version_tracker-linux-aarch64

      - name: Rename binary (main)
        if: github.ref == 'refs/heads/main'
        run: cp target/release/version_tracker version_tracker-linux-aarch64

      - name: Create GitHub Release and upload binary
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          files: version_tracker-linux-aarch64
          make_latest: true

      - name: Upload dev artifact
        if: github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: version_tracker-dev-${{ github.sha }}
          path: version_tracker-linux-aarch64
          retention-days: 7
